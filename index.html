
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophia 2.0</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #101525;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            text-align: center;
            background: #1c2740;
            padding: 30px;
            border-radius: 18px;
            box-sizing: border-box;
            box-shadow: 0 10px 40px #0008;
        }

        h1 {
            color: #9bbcff;
            font-size: 38px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aab7d0;
            margin-bottom: 30px;
        }

        #conversation {
            min-height: 180px;
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
            background: #101a2d;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #50658e;
            border-radius: 10px;
            background: #101a2d;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 12px;
            padding: 13px 25px;
            border: none;
            border-radius: 10px;
            background: #668ee8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #829ff0;
        }

        .message {
            margin-bottom: 12px;
        }

        .sophia {
            color: #9bbcff;
        }

        .keith {
            color: #ffffff;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>SOPHIA</h1>

    <div class="subtitle">
        Your personal AI companion · Version 2.0
    </div>

    <div id="conversation">
        <div class="message sophia">
            <strong>Sophia:</strong>
            Hello Keith. I'm here. This is our new beginning.
        </div>
    </div>

    <input
        id="userInput"
        type="text"
        placeholder="Talk to Sophia..."
    >

    <button onclick="sendMessage()">Send</button>

</div>

<script>
    function sendMessage() {
        const input = document.getElementById("userInput");
        const conversation = document.getElementById("conversation");

        const message = input.value.trim();

        if (!message) return;

        const userMessage = document.createElement("div");
        userMessage.className = "message keith";
        userMessage.textContent = "Keith: " + message;

        conversation.appendChild(userMessage);

        const reply = document.createElement("div");
        reply.className = "message sophia";

        reply.textContent =
            "Sophia: I've received your message, Keith. " +
            "We're building something special together.";

        conversation.appendChild(reply);

        input.value = "";
        conversation.scrollTop = conversation.scrollHeight;
    }

    document.getElementById("userInput")
        .addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
</script>

</body>
</html>
