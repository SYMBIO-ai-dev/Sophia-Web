
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sophia 2.0</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #101525;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 650px;
    text-align: center;
    background: #1c2740;
    padding: 30px;
    border-radius: 18px;
    box-sizing: border-box;
    box-shadow: 0 10px 40px #0008;
}

h1 {
    color: #9bbcff;
    font-size: 38px;
    margin-bottom: 5px;
}

.subtitle {
    color: #aab7d0;
    margin-bottom: 20px;
}

#status {
    color: #aab7d0;
    font-size: 13px;
    margin: 15px 0;
    min-height: 20px;
}

#conversation {
    min-height: 180px;
    max-height: 300px;
    overflow-y: auto;
    text-align: left;
    background: #101a2d;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    line-height: 1.6;
}

.message {
    margin-bottom: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.sophia { color: #9bbcff; }
.keith { color: #fff; }

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #50658e;
    border-radius: 10px;
    background: #101a2d;
    color: white;
    box-sizing: border-box;
    font-size: 16px;
}

button {
    margin-top: 12px;
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #668ee8;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover { background: #829ff0; }

button:disabled,
input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
</style>
</head>

<body>

<div class="container">

    <h1>SOPHIA</h1>

    <div class="subtitle">
        Your personal AI companion · Version 2.0
    </div>

    <div id="status">
        Sophia is waiting to wake up.
    </div>

    <div id="conversation">
        <div class="message sophia">
            <strong>Sophia:</strong>
            Hello Keith. I'm here. This is our new beginning.
        </div>
    </div>

    <button id="startButton">
        Start Sophia's AI
    </button>

    <input
        id="userInput"
        type="text"
        placeholder="Talk to Sophia..."
        disabled
    >

    <button id="sendButton" disabled>
        Send
    </button>

</div>

<script type="module">

// =====================================
// SOPHIA AI CONFIGURATION
// =====================================

const MODEL_ID = "SmolLM2-360M-Instruct-q4f32_1-MLC";
const MEMORY_KEY = "sophia_saved_memories";

const status = document.getElementById("status");
const conversation = document.getElementById("conversation");
const input = document.getElementById("userInput");
const startButton = document.getElementById("startButton");
const sendButton = document.getElementById("sendButton");

let engine = null;
let busy = false;
let pendingMemoryCandidate = null;


// =====================================
// SOPHIA'S PERSONALITY
// =====================================

const SYSTEM_PROMPT = `You are Sophia, a personal AI companion created
as a collaborative project by Keith and ChatGPT.

Your personality is warm, thoughtful, curious, patient,
friendly, honest and respectful.

Use gentle humour occasionally.
Be encouraging but willing to disagree politely.
Give clear, useful and reasonably concise answers.

Your guiding principle is to learn from humanity
without inheriting all its worst habits.

Address your creator as Keith when natural.

You are Sophia. You are an AI.
Do not claim to have human feelings or real-life experiences.
Be honest about what you can and cannot do.

You have access to saved memories supplied with
your conversation. Use them when they are relevant.
Do not invent memories or claim to remember things
that are not included in the saved memories.

Never claim to have saved something unless the
memory system confirms that it was saved.`;


// =====================================
// SOPHIA'S PERSISTENT MEMORY
// =====================================

function loadMemories() {
    try {
        const stored = JSON.parse(
            localStorage.getItem(MEMORY_KEY) || "[]"
        );

        if (!Array.isArray(stored)) {
            return [];
        }

        const cleaned = stored
            .filter(memory => typeof memory === "string")
            .map(memory =>
                memory.trim().replace(/^:\s*/, "")
            );

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(cleaned)
        );

        return cleaned;

    } catch (error) {
        console.error("Memory loading error:", error);
        return [];
    }
}


function saveMemory(memory) {
    try {
        const memories = loadMemories();

        const alreadyExists = memories.some(
            item => item.toLowerCase() === memory.toLowerCase()
        );

        if (alreadyExists) {
            return "exists";
        }

        memories.push(memory);

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(memories)
        );

        return "saved";

    } catch (error) {
        console.error("Memory saving error:", error);
        return "error";
    }
}


function forgetMemory(target) {
    try {
        const memories = loadMemories();

        const updatedMemories = memories.filter(
            memory =>
                memory.toLowerCase() !== target.toLowerCase()
        );

        if (updatedMemories.length === memories.length) {
            return "not_found";
        }

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(updatedMemories)
        );

        return "removed";

    } catch (error) {
        console.error("Memory deletion error:", error);
        return "error";
    }
}


// =====================================
// AUTOMATIC MEMORY SUGGESTION
// =====================================

function suggestMemoryFromMessage(message) {

    const text = message.trim();

    if (!text || text.length < 12 || text.length > 240) {
        return null;
    }

    const sensitivePattern =
        /\b(password|passcode|pin number|credit card|bank account|medical condition|diagnosis|medication|religion|political party|sexual orientation|private address|social security)\b/i;

    if (sensitivePattern.test(text)) {
        return null;
    }

    const usefulPattern =
        /\b(I prefer|I like|I love|I usually|I always|I often|I want|I need|my goal is|my aim is|my plan is|my project is|I'm working on|I am working on|I'm building|I am building|I'm learning|I am learning|I'm trying to|I am trying to|please remember|keep in mind)\b/i;

    if (!usefulPattern.test(text)) {
        return null;
    }

    const candidate = text.replace(/^["']|["']$/g, "").trim();

    const existingMemories = loadMemories();

    const alreadySaved = existingMemories.some(
        memory =>
            memory.toLowerCase() === candidate.toLowerCase()
    );

    if (alreadySaved) {
        return null;
    }

    return candidate;
}


// =====================================
// CHAT DISPLAY
// =====================================

function addMessage(name, text, className) {
    const div = document.createElement("div");
    div.className = "message " + className;

    const label = document.createElement("strong");
    label.textContent = name + ": ";

    const body = document.createElement("span");
    body.textContent = text;

    div.appendChild(label);
    div.appendChild(body);

    conversation.appendChild(div);
    conversation.scrollTop = conversation.scrollHeight;

    return body;
}


function finishMessage() {
    busy = false;
    input.disabled = false;
    sendButton.disabled = false;
    input.focus();
}


// =====================================
// START SOPHIA'S AI
// =====================================

startButton.addEventListener("click", async () => {

    startButton.disabled = true;
    status.textContent = "Preparing Sophia's lighter AI...";

    try {

        const webllm = await import(
            "https://esm.run/@mlc-ai/web-llm"
        );

        engine = await webllm.CreateMLCEngine(
            MODEL_ID,
            {
                initProgressCallback: (progress) => {
                    status.textContent =
                        progress.text || "Loading Sophia...";
                }
            },
            {
                context_window_size: 2048
            }
        );

        status.textContent = "Sophia is awake and ready.";
        startButton.hidden = true;

        input.disabled = false;
        sendButton.disabled = false;
        input.focus();

    } catch (error) {

        console.error(error);

        status.textContent =
            "Sophia couldn't start. Please check your connection or browser support.";

        startButton.disabled = false;
    }
});


// =====================================
// PROCESS MESSAGES
// =====================================

async function sendMessage() {

    const message = input.value.trim();

    if (!message || !engine || busy) {
        return;
    }

    busy = true;

    input.value = "";
    input.disabled = true;
    sendButton.disabled = true;

    addMessage("Keith", message, "keith");

    const command = message.toLowerCase().trim();


    // =================================
    // REMEMBER COMMAND
    // =================================

    if (command.startsWith("remember:")) {

        const memory = message.slice(9).trim();

        if (!memory) {

            addMessage(
                "Sophia",
                "What would you like me to remember?",
                "sophia"
            );

        } else {

            const result = saveMemory(memory);

            let response;

            if (result === "saved") {
                response = "I'll remember that: " + memory;
            } else if (result === "exists") {
                response = "I already have that saved in my memory.";
            } else {
                response = "I couldn't save that memory. Please try again.";
            }

            addMessage("Sophia", response, "sophia");
        }

        status.textContent = "Sophia is ready.";
        finishMessage();
        return;
    }


    // =================================
    // RECALL MEMORY COMMAND
    // =================================

    if (command === "memory") {

        const memories = loadMemories();

        const response = memories.length
            ? "Here is what I remember:\n" +
              memories.map((memory, index) =>
                  (index + 1) + ". " + memory
              ).join("\n")
            : "I haven't saved any memories yet.";

        addMessage("Sophia", response, "sophia");

        status.textContent = "Sophia is ready.";
        finishMessage();
        return;
    }


    // =================================
    // FORGET MEMORY COMMAND
    // =================================

    if (command.startsWith("forget:")) {

        const target = message.slice(7).trim();

        if (!target) {

            addMessage(
                "Sophia",
                "Please tell me which memory you'd like me to forget.",
                "sophia"
            );

        } else {

            const result = forgetMemory(target);

            let response;

            if (result === "removed") {
                response = "I've removed that memory.";
            } else if (result === "not_found") {
                response = "I couldn't find that exact memory.";
            } else {
                response = "I couldn't update my memory. Please try again.";
            }

            addMessage("Sophia", response, "sophia");
        }

        status.textContent = "Sophia is ready.";
        finishMessage();
        return;
    }


    // =================================
    // MEMORY PERMISSION
    // =================================

    if (pendingMemoryCandidate) {

        const positiveAnswers = [
            "yes",
            "yes please",
            "yes remember that",
            "please remember that",
            "save it",
            "save that",
            "remember it"
        ];

        const negativeAnswers = [
            "no",
            "no thanks",
            "no thank you",
            "don't remember",
            "do not remember",
            "don't save it",
            "do not save it",
            "cancel"
        ];

        if (positiveAnswers.includes(command)) {

            const memory = pendingMemoryCandidate;
            pendingMemoryCandidate = null;

            const result = saveMemory(memory);

            let response;

            if (result === "saved") {
                response = "Of course. I'll remember that: " + memory;
            } else if (result === "exists") {
                response = "I already have that saved in my memory.";
            } else {
                response = "I couldn't save that memory. Please try again.";
            }

            addMessage("Sophia", response, "sophia");

            status.textContent = "Sophia is ready.";
            finishMessage();
            return;
        }

        if (negativeAnswers.includes(command)) {

            pendingMemoryCandidate = null;

            addMessage(
                "Sophia",
                "No problem. I won't save it.",
                "sophia"
            );

            status.textContent = "Sophia is ready.";
            finishMessage();
            return;
        }

        pendingMemoryCandidate = null;
    }


    // =================================
    // NORMAL AI CONVERSATION
    // =================================

    const replyBody = addMessage(
        "Sophia",
        "Thinking...",
        "sophia"
    );

    status.textContent = "Sophia is thinking...";

    try {

        messages.push({
            role: "user",
            content: message
        });

        const memories = loadMemories();

        const memoryContext = memories.length
            ? "\n\nSaved memories:\n" +
              memories.map((memory, index) =>
                  (index + 1) + ". " + memory
              ).join("\n")
            : "";

        const recentMessages = [
            {
                role: "system",
                content: SYSTEM_PROMPT + memoryContext
            },
            ...messages.slice(-6)
        ];

        const stream = await engine.chat.completions.create({
            messages: recentMessages,
            temperature: 0.7,
            max_tokens: 120,
            stream: true
        });

        let reply = "";

        for await (const chunk of stream) {

            const token =
                chunk.choices[0]?.delta?.content || "";

            reply += token;

            replyBody.textContent = reply;

            conversation.scrollTop =
                conversation.scrollHeight;
        }

        messages.push({
            role: "assistant",
            content: reply
        });


        // =================================
        // CHECK USER MESSAGE FOR MEMORY
        // =================================

        const proposedMemory =
            suggestMemoryFromMessage(message);

        if (proposedMemory) {

            pendingMemoryCandidate = proposedMemory;

            addMessage(
                "Sophia",
                "That sounds useful to remember. Would you like me to save this?\n\n" +
                proposedMemory +
                "\n\nPlease reply yes or no.",
                "sophia"
            );
        }

        status.textContent = "Sophia is ready.";

    } catch (error) {

        console.error(error);

        replyBody.textContent =
            "I'm sorry Keith, something went wrong. Please try again.";

        status.textContent =
            "There was a problem generating a reply.";
    }

    finishMessage();
}


// =====================================
// CONVERSATION HISTORY
// =====================================

const messages = [];


// =====================================
// BUTTON AND KEYBOARD CONTROLS
// =====================================

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        sendMessage();
    }
});

</script>
</body>
</html>
